---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-patcher
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-patch-amd64
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 10800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: image-patcher
            app.kubernetes.io/component: build-amd64
        spec:
          serviceAccountName: image-patcher
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          initContainers:
            - name: plan
              image: public.ecr.aws/amazonlinux/amazonlinux:2023.12.20261102.0
              command: ["/bin/sh", "/config/patch.sh", "plan-build", "amd64"]
              env:
                - {name: AWS_REGION, value: us-east-1}
              resources:
                requests: {cpu: 250m, memory: 768Mi}
                limits: {memory: 1536Mi}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: work, mountPath: /work}
          containers:
            - name: build
              image: 774305584254.dkr.ecr.us-east-1.amazonaws.com/ghcr/osscontainertools/kaniko:v1.28.6-debug
              command: ["/busybox/sh", "/config/patch.sh", "build", "amd64"]
              resources:
                requests: {cpu: "2", memory: 4Gi, ephemeral-storage: 20Gi}
                limits: {memory: 8Gi, ephemeral-storage: 40Gi}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: docker-config, mountPath: /kaniko/.docker, readOnly: true}
          volumes:
            - {name: config, configMap: {name: image-patcher}}
            - {name: work, emptyDir: {}}
            - {name: docker-config, configMap: {name: kaniko-docker-config}}
---
