---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: image-patch-index
spec:
  schedule: "17 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: image-patcher
            app.kubernetes.io/component: index
        spec:
          serviceAccountName: image-patcher
          restartPolicy: Never
          initContainers:
            - name: plan
              image: public.ecr.aws/amazonlinux/amazonlinux:2023.12.20261102.0
              command: ["/bin/sh", "/config/patch.sh", "plan-index"]
              env:
                - {name: AWS_REGION, value: us-east-1}
              resources:
                requests: {cpu: 250m, memory: 768Mi}
                limits: {memory: 1536Mi}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: work, mountPath: /work}
          containers:
            - name: index
              image: gcr.io/go-containerregistry/crane@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
              command: ["/busybox/sh", "/config/patch.sh", "index"]
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: work, mountPath: /work, readOnly: true}
          volumes:
            - {name: config, configMap: {name: image-patcher}}
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
