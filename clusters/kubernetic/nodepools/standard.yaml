---
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: standard
spec:
  role: AmazonEKSAutoNodeRole
  subnetSelectorTerms:
    - id: subnet-0b045048389a1ba95
    - id: subnet-055ef85eee70f0dfe
    - id: subnet-07f3f11f322be406d
    - id: subnet-094c4e8b06d501d72
    - id: subnet-00da67ad9e9dc4d5b
    - id: subnet-0406cf0910cafe58e
    - id: subnet-02552135b552f974c
    - id: subnet-0b08a759ea6e3efa1
  securityGroupSelectorTerms:
    - id: sg-0604e94232884f62e
  ephemeralStorage:
    size: 160Gi
    iops: 6000
    throughput: 500
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: standard
spec:
  weight: 50
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: standard
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64, arm64]}
        - {key: kubernetes.io/os, operator: In, values: [linux]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: eks.amazonaws.com/instance-category, operator: In, values: [c, m, r]}
        - {key: eks.amazonaws.com/instance-generation, operator: Gt, values: ["4"]}
      expireAfter: 336h
  limits:
    cpu: "1500"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
