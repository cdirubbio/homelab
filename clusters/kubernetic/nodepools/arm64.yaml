---
# Graviton nodes for arm64 builds. The built-in general-purpose NodePool is
# amd64 only. Tainted so only pods that ask for arm64 (and tolerate the taint)
# land here; everything else keeps running on amd64.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: arm64
spec:
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [arm64]}
        - {key: kubernetes.io/os, operator: In, values: [linux]}
        - {key: karpenter.sh/capacity-type, operator: In, values: [on-demand]}
        - {key: eks.amazonaws.com/instance-category, operator: In, values: [c, m, r]}
        - {key: eks.amazonaws.com/instance-generation, operator: Gt, values: ["6"]}
      taints:
        - {key: arch, value: arm64, effect: NoSchedule}
      expireAfter: 336h
  limits:
    cpu: "16"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
