---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: build-subdc-backend
  namespace: builds
spec:
  suspend: false
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kaniko
            app.kubernetes.io/instance: build-subdc-backend
        spec:
          serviceAccountName: kaniko
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: kaniko
              image: 774305584254.dkr.ecr.us-east-1.amazonaws.com/ghcr/osscontainertools/kaniko:v1.28.6
              args:
                - --context=git://github.com/cdirubbio/subdc.git#refs/heads/main
                - --context-sub-path=backend/src
                - --dockerfile=Dockerfile
                - --destination=774305584254.dkr.ecr.us-east-1.amazonaws.com/subdc/backend:latest
                - --cache=true
                - --cache-repo=774305584254.dkr.ecr.us-east-1.amazonaws.com/subdc/backend-cache
                - --snapshot-mode=redo
                - --compressed-caching=false
                - --registry-map=index.docker.io=public.ecr.aws/docker
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                  ephemeral-storage: 10Gi
                limits:
                  memory: 4Gi
                  ephemeral-storage: 30Gi
              volumeMounts:
                - name: docker-config
                  mountPath: /kaniko/.docker
                  readOnly: true
          volumes:
            - name: docker-config
              configMap:
                name: kaniko-docker-config
