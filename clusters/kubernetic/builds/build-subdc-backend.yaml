---
# Builds github.com/cdirubbio/subdc backend/src -> ECR subdc/backend:latest.
# Run now: kubectl -n builds create job --from=cronjob/build-subdc-backend build-subdc-backend-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: build-subdc-backend
  namespace: builds
spec:
  suspend: false
  schedule: "* * * * *"              # every minute (Kubernetes CronJob minimum)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kaniko
            app.kubernetes.io/instance: build-subdc-backend
        spec:
          serviceAccountName: kaniko
          restartPolicy: Never
          # Kaniko builds for the node's architecture, so pin it. The built-in
          # Auto Mode general-purpose NodePool is amd64 only; arm64 needs a
          # custom NodePool.
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: kaniko
              image: 774305584254.dkr.ecr.us-east-1.amazonaws.com/ghcr/osscontainertools/kaniko:v1.28.6  # one-time copy of ghcr.io/osscontainertools/kaniko (scripts/kubernetic-builds-aws-setup.sh)
              args:
                - --context=git://github.com/cdirubbio/subdc.git#refs/heads/main
                - --context-sub-path=backend/src
                - --dockerfile=Dockerfile
                - --destination=774305584254.dkr.ecr.us-east-1.amazonaws.com/subdc/backend:latest
                # Layer cache stored in ECR, so rebuilds are fast.
                - --cache=true
                - --cache-repo=774305584254.dkr.ecr.us-east-1.amazonaws.com/subdc/backend-cache
                - --snapshot-mode=redo
                - --compressed-caching=false    # lower memory use
                # Pull Docker Hub base images from ECR Public's mirror instead
                # (no anonymous rate limit); falls back to Docker Hub if missing.
                - --registry-map=index.docker.io=public.ecr.aws/docker
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                  ephemeral-storage: 10Gi
                limits:
                  memory: 4Gi
                  ephemeral-storage: 30Gi
              volumeMounts:
                - name: docker-config
                  mountPath: /kaniko/.docker
                  readOnly: true
          volumes:
            - name: docker-config
              configMap:
                name: kaniko-docker-config
