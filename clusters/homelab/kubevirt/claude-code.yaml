---
apiVersion: v1
kind: Namespace
metadata:
  name: claude
---
# Persistent disk: docker images, ~/.claude config/sessions, and /work/projects.
# The VM root disk is an ephemeral containerDisk; everything worth keeping lives here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: claude-code-work
  namespace: claude
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: claude-code
  namespace: claude
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        kubevirt.io/domain: claude-code
    spec:
      domain:
        cpu:
          cores: 2
        memory:
          guest: 2Gi
        devices:
          disks:
            - name: root
              disk: { bus: virtio }
            - name: work
              serial: work
              disk: { bus: virtio }
            # Secret claude-code-env (GH-flux-infra) shows up as a read-only disk;
            # every key in it becomes an env var inside the claude container.
            - name: env
              serial: claudeenv
              disk: { bus: virtio }
            - name: cloudinit
              disk: { bus: virtio }
          interfaces:
            - name: default
              masquerade: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: root
          containerDisk:
            image: quay.io/containerdisks/ubuntu:24.04
        - name: work
          persistentVolumeClaim:
            claimName: claude-code-work
        - name: env
          secret:
            secretName: claude-code-env
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: claude-code
              manage_etc_hosts: true
              groups: [docker]
              users:
                - name: ubuntu
                  groups: [sudo, docker]
                  shell: /bin/bash
                  sudo: "ALL=(ALL) NOPASSWD:ALL"
                  lock_passwd: true
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFGWRDwoyOiPFAIvhDiBKM2Ulv0XzGuyNHdalcPyV+Oz
              ssh_pwauth: false
              write_files:
                - path: /etc/docker/daemon.json
                  content: |
                    { "data-root": "/work/docker" }
                - path: /usr/local/bin/claude
                  permissions: "0755"
                  content: |
                    #!/bin/bash
                    # Runs Claude Code in the Harbor image. Projects live in /work/projects (mounted at /app).
                    set -euo pipefail
                    envf=$(mktemp); trap 'rm -f "$envf"' EXIT
                    for f in /mnt/claude-env/*; do
                      [ -f "$f" ] && printf '%s=%s\n' "$(basename "$f")" "$(cat "$f")" >> "$envf"
                    done
                    exec docker run --rm -it --pull=always \
                      --env-file "$envf" \
                      -e CLAUDE_CONFIG_DIR=/root/.claude \
                      -v /work/claude-config:/root/.claude \
                      -v /work/projects:/app -w /app \
                      harbor.chrdir.com/harborian/claude-code:latest claude "$@"
              runcmd:
                - [sh, -c, "blkid /dev/disk/by-id/virtio-work || mkfs.ext4 -L work /dev/disk/by-id/virtio-work"]
                - mkdir -p /work /mnt/claude-env
                - [sh, -c, "echo 'LABEL=work /work ext4 defaults,nofail 0 2' >> /etc/fstab"]
                - [sh, -c, "echo '/dev/disk/by-id/virtio-claudeenv /mnt/claude-env iso9660 ro,nofail 0 0' >> /etc/fstab"]
                - mount -a
                - mkdir -p /work/docker /work/containerd /work/claude-config /work/projects /var/lib/containerd
                # docker's containerd image store ignores data-root; keep it on the big disk too
                - [sh, -c, "echo '/work/containerd /var/lib/containerd none bind,nofail,x-systemd.requires-mounts-for=/work 0 0' >> /etc/fstab"]
                - mount /var/lib/containerd
                - chown -R ubuntu:ubuntu /work/projects
                - [sh, -c, "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io"]
                - systemctl enable --now docker
                - docker pull harbor.chrdir.com/harborian/claude-code:latest
