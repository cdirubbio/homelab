apiVersion: v1
kind: Namespace
metadata:
  name: cdhyp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cdhyp-ci-rollout
  namespace: cdhyp
rules:
- apiGroups:
  - apps
  resourceNames:
  - cdhyp
  resources:
  - deployments
  verbs:
  - get
  - watch
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cdhyp-ci-rollout
  namespace: cdhyp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cdhyp-ci-rollout
subjects:
- kind: ServiceAccount
  name: cdhyp-build
  namespace: cdhyp-ci
---
apiVersion: v1
data:
  AUTH_MODE: oidc
  BASE_URL: https://cdhyp.dirubbio.com
  LOG_LEVEL: info
  OIDC_CLIENT_ID: cdhyp
  OIDC_ISSUER: https://auth.dirubbio.com
  OIDC_SCOPES: openid profile email groups
  ADMIN_GROUP: lldap_admin
  SESSION_TTL: 720h
kind: ConfigMap
metadata:
  name: cdhyp
  namespace: cdhyp
---
apiVersion: v1
kind: Service
metadata:
  name: cdhyp
  namespace: cdhyp
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: cdhyp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: cdhyp
  name: cdhyp
  namespace: cdhyp
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: cdhyp
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdhyp
    spec:
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - configMapRef:
            name: cdhyp
        - secretRef:
            name: cdhyp
        image: harbor.chrdir.com/harborian/cdhyp:latest
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
        name: cdhyp
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: cdhyp
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cdhyp
  namespace: cdhyp
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cdhyp
