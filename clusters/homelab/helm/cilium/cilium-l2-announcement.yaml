apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: ingress
spec:
  blocks:
    - start: 192.168.1.50
      stop: 192.168.1.50
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: ingress
spec:
  serviceSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  interfaces:
    - ^eth[0-9]+
  loadBalancerIPs: true
