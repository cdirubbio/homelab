apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: flux-system
spec:
  releaseName: harbor
  interval: 30m
  chart:
    spec:
      chart: harbor
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: harbor
        namespace: flux-system
  targetNamespace: harbor
  values:
    externalURL: https://harbor.chrdir.com
    # chart bug: certSource=secret leaves the core ca-download volume empty without this
    caSecretName: harbor-tls
    # registry/jobservice use RWO Longhorn volumes; RollingUpdate causes Multi-Attach errors
    updateStrategy:
      type: Recreate
    expose:
      type: ingress
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: harbor-tls
      ingress:
        className: traefik
        hosts:
          core: harbor.chrdir.com
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
