apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  releaseName: my-headlamp
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: "0.46.x"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  targetNamespace: kube-system
  storageNamespace: kube-system
  values:
    service:
      type: NodePort
      nodePort: 30875
    config:
      oidc:
        secret:
          create: false
        externalSecret:
          enabled: true
          name: headlamp-oidc
          hasScopes: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-admins-cluster-admin
subjects:
  - kind: Group
    name: oidc:admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
