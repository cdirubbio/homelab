apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  targetNamespace: kube-system
  releaseName: traefik
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: flux-system
  interval: 10m
  values:
    accessLog:
      enabled: true
      format: json

    providers:
      kubernetesIngress:
        enabled: true

    service:
      annotations:
        lbipam.cilium.io/ips: "192.168.1.50"

    deployment:
      replicas: 2

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-kube-system
            topologyKey: kubernetes.io/hostname
