---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mongress
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - prometheus.chrdir.com
      secretName: chrdir-cert-phmjv
  rules:
    - host: prometheus.chrdir.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kps-kube-prometheus-stack-prometheus
                port:
                  number: 9090
---
