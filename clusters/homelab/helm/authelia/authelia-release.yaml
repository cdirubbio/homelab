apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: flux-system
spec:
  releaseName: authelia
  interval: 30m
  chart:
    spec:
      chart: authelia
      version: "0.11.x"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  targetNamespace: authelia
  install:
    createNamespace: true
  values:
    pod:
      kind: Deployment
      replicas: 1
      strategy:
        type: Recreate

    service:
      type: NodePort
      nodePort: 30091

    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi

    secret:
      additionalSecrets:
        authelia-users: {}

    configMap:
      theme: auto

      session:
        cookies:
          - domain: dirubbio.com
            subdomain: auth

      storage:
        local:
          enabled: true
          path: /config/db.sqlite3

      notifier:
        filesystem:
          enabled: true
          filename: /config/notification.txt

      authentication_backend:
        password_reset:
          disable: true
        password_change:
          disable: true
        file:
          enabled: true
          path: /secrets/authelia-users/users_database.yml

      access_control:
        default_policy: deny
        rules:
          - domain: '*.dirubbio.com'
            policy: two_factor
