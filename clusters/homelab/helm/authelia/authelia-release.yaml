apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: flux-system
spec:
  releaseName: authelia
  interval: 30m
  chart:
    spec:
      chart: authelia
      version: "0.11.x"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: flux-system
  targetNamespace: authelia
  install:
    createNamespace: true
  values:
    pod:
      kind: Deployment
      replicas: 1
      strategy:
        type: Recreate

    service:
      type: NodePort
      nodePort: 30091

    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi

    secret:
      additionalSecrets:
        authelia-users: {}
        authelia-oidc: {}
        authelia-ldap: {}

    configMap:
      theme: auto

      session:
        cookies:
          - domain: dirubbio.com
            subdomain: auth

      storage:
        local:
          enabled: true
          path: /config/db.sqlite3

      notifier:
        filesystem:
          enabled: true
          filename: /config/notification.txt

      authentication_backend:
        password_reset:
          disable: true
        password_change:
          disable: true
        ldap:
          enabled: true
          implementation: lldap
          address: ldap://lldap.lldap.svc.cluster.local:3890
          base_dn: dc=chrdir,dc=com
          user: uid=authelia,ou=people,dc=chrdir,dc=com
          password:
            secret_name: authelia-ldap
            path: password

      identity_providers:
        oidc:
          enabled: true
          jwks:
            - key_id: main
              algorithm: RS256
              use: sig
              key:
                path: /secrets/authelia-oidc/jwks.pem
          authorization_policies:
            gym:
              default_policy: deny
              rules:
                - policy: two_factor
                  subject: group:gym
          claims_policies:
            kubernetes:
              id_token:
                - email
                - email_verified
                - preferred_username
                - groups
          clients:
            - client_id: headlamp
              client_name: Headlamp
              client_secret:
                path: /secrets/authelia-oidc/headlamp.digest
              claims_policy: kubernetes
              authorization_policy: two_factor
              redirect_uris:
                - https://k8s.dirubbio.com/oidc-callback
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              token_endpoint_auth_method: client_secret_basic

            - client_id: cdhyp
              client_name: cdhyp
              client_secret:
                path: /secrets/authelia-oidc/cdhyp.digest
              authorization_policy: gym
              require_pkce: true
              pkce_challenge_method: S256
              redirect_uris:
                - https://cdhyp.dirubbio.com/auth/callback
              scopes:
                - openid
                - profile
                - email
              grant_types:
                - authorization_code
              response_types:
                - code
              token_endpoint_auth_method: client_secret_basic
      access_control:
        default_policy: deny
        rules:
          - domain: '*.dirubbio.com'
            policy: two_factor
