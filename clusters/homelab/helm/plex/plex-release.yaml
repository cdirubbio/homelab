apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: flux-system
spec:
  releaseName: plex
  interval: 30m
  chart:
    spec:
      chart: plex-media-server
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: plex
        namespace: flux-system
  targetNamespace: default
