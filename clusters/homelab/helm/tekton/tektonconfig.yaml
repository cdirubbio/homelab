apiVersion: operator.tekton.dev/v1alpha1
kind: TektonConfig
metadata:
  name: config
spec:
  profile: basic
  targetNamespace: tekton-pipelines
  chain:
    disabled: true
  result:
    disabled: true
  pruner:
    disabled: false
    resources: [taskrun, pipelinerun]
    keep: 20
    schedule: "0 4 * * *"
