# Custom resources whose CRDs are installed by HelmReleases (e.g. TektonConfig).
# They live outside ./clusters/homelab so a missing CRD can't break the main
# flux-system sync; this Kustomization just retries until the CRDs exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-crs
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  path: ./clusters/homelab-crs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
