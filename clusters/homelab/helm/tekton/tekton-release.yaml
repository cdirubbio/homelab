apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-operator
  namespace: flux-system
spec:
  targetNamespace: tekton-operator
  releaseName: tekton-operator
  chartRef:
    kind: OCIRepository
    name: tekton-operator
    namespace: flux-system
  interval: 10m
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    operator:
      autoInstallComponents: false
