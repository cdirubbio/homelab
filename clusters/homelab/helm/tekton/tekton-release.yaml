apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-operator
  namespace: flux-system
spec:
  targetNamespace: tekton-operator
  releaseName: tekton-operator
  chartRef:
    kind: OCIRepository
    name: tekton-operator
    namespace: flux-system
  interval: 10m
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    operator:
      # The default "basic" profile also installs Chains and Results (Results needs
      # its own Postgres). We declare our own TektonConfig instead; see
      # tektonconfig.yaml in this folder.
      autoInstallComponents: false
