---
# Namespace + identity for in-cluster container image builds (Kaniko).
#
# Kaniko runs as root *inside* its container but needs no privileged mode,
# no extra capabilities and no host mounts, so the namespace can enforce the
# Pod Security "baseline" profile.
apiVersion: v1
kind: Namespace
metadata:
  name: builds
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
---
# Build pods never talk to the Kubernetes API, so no token is mounted and
# no RBAC is granted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kaniko
  namespace: builds
automountServiceAccountToken: false
