---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-data-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-server
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual-server
  template:
    metadata:
      labels:
        app: actual-server
    spec:
      containers:
        - name: actual-server
          image: docker.io/actualbudget/actual-server:latest
          ports:
            - containerPort: 5006
          livenessProbe:
            exec:
              command:
                - node
                - src/scripts/health-check.js
            initialDelaySeconds: 20
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - node
                - src/scripts/health-check.js
            initialDelaySeconds: 20
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: actual-data
              mountPath: /data
      volumes:
        - name: actual-data
          persistentVolumeClaim:
            claimName: actual-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: actual-server
  namespace: default
spec:
  selector:
    app: actual-server
  ports:
    - port: 5006
      targetPort: 5006
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual-server
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - actual.chrdir.com
      secretName: actual-tls
  rules:
    - host: actual.chrdir.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual-server
                port:
                  number: 5006
---
