---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      dnsConfig:
        nameservers:
          - 8.8.8.8
      # hostNetwork: true
      containers:
        - name: gatus
          image: twinproduction/gatus:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: gatus-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: gatus-config
          configMap:
            name: gatus-config
            namespace: default
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: default
spec:
  selector:
    app: gatus
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: default
data:
  config.yaml: |
    storage:
      type: memory

    ui:
      default-sort-by: group

    endpoints:
      - name: Proxmox VE PVE
        group: Infrastructure
        url: https://pve.chrdir.com.
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Proxmox VE PVEN
        group: Infrastructure
        url: https://pven.chrdir.com.
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Nginx Proxy Manager
        group: Infrastructure
        url: https://npm.chrdir.com.
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Authelia
        group: Infrastructure
        url: http://authelia.authelia.svc.cluster.local/api/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].status == OK"

      - name: Headlamp
        group: Kubernetes
        url: http://my-headlamp.kube-system.svc.cluster.local
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Grafana
        group: Kubernetes
        url: http://kps-grafana.monitoring.svc.cluster.local
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Longhorn
        group: Kubernetes
        url: https://longhorn.chrdir.com./#/dashboard
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Harbor
        group: Kubernetes
        url: http://harbor-core.harbor.svc.cluster.local/api/v2.0/health
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].status == healthy"

      - name: Prometheus
        group: Kubernetes
        url: http://kps-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/healthy
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Docmost
        group: Applications
        url: http://docmost.default.svc.cluster.local:3000
        interval: 60s
        conditions:
          - "[STATUS] == 200"

      - name: Glance
        group: Applications
        url: http://glance.default.svc.cluster.local:8080
        interval: 60s
        conditions:
          - "[STATUS] == 200"
---